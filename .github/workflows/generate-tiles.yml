name: Generate Tiles Manifest

# Rebuilds tiles.json from the tile images in R2 and uploads it to
# r2://cms-assets/dokimosaic/tiles.json. Run this whenever emotes are added
# or updated. Requires repo secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and
# R2_SECRET_ACCESS_KEY (an R2 API token with read+write on the bucket).

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

on:
    workflow_dispatch:
        inputs:
            subfolders:
                description: "Bucket subfolders to scan (comma-separated)"
                required: false
                default: "dokimotes"
            ignore_extensions:
                description: "File extensions to skip (comma-separated)"
                required: false
                default: "gif,webp,csv"
            ignore_suffixes:
                description: "Key suffixes to skip, e.g. size variants (comma-separated)"
                required: false
                default: "_p.webp,_t.webp"
            upload:
                description: "Upload the manifest to R2 (uncheck for a dry run)"
                type: boolean
                required: false
                default: true

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - name: Checkout Code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "22"

            - name: Install Dependencies
              run: npm ci

            - name: Verify Package Signatures
              run: npm audit signatures --min-release-age=0

            - name: Generate tiles.json
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  TILES_SUBFOLDERS: ${{ inputs.subfolders }}
                  TILES_IGNORE_EXTENSIONS: ${{ inputs.ignore_extensions }}
                  TILES_IGNORE_SUFFIXES: ${{ inputs.ignore_suffixes }}
              run: node scripts/generate-tiles.mjs ${{ inputs.upload && '--upload' || '' }}

            - name: Attach Manifest Artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: tiles-manifest
                  path: tiles.json
