name: Generate Tiles Manifest

# Rebuilds tiles.json from the tile images in R2 and uploads it to
# r2://cms-assets/dokimosaic/tiles.json (the manifest_key input). Run this
# whenever emotes are added or updated. Requires repo secrets R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (an R2 API token with read+write
# on the bucket).

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

on:
    workflow_dispatch:
        inputs:
            subfolders:
                description: "Bucket subfolders to scan, one emote palette each (comma-separated)"
                required: false
                default: "dokimotes,mintomotes"
            ignore_extensions:
                description: "File extensions to skip (comma-separated)"
                required: false
                default: "webp,csv"
            ignore_suffixes:
                description: "Key suffixes to skip, e.g. size variants (comma-separated)"
                required: false
                default: "_p.webp,_t.webp"
            manifest_key:
                description: "Bucket key to upload the manifest to"
                required: false
                default: "dokimosaic/tiles.json"
            upload:
                description: "Upload the manifest to R2 (uncheck for a dry run)"
                type: boolean
                required: false
                default: true

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "22"

            - name: Install Dependencies
              run: npm ci

            - name: Verify Package Signatures
              run: npm audit signatures --min-release-age=0

            - name: Generate tiles.json
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  TILES_SUBFOLDERS: ${{ inputs.subfolders }}
                  TILES_IGNORE_EXTENSIONS: ${{ inputs.ignore_extensions }}
                  TILES_IGNORE_SUFFIXES: ${{ inputs.ignore_suffixes }}
                  TILES_MANIFEST_KEY: ${{ inputs.manifest_key }}
              run: node scripts/generate-tiles.mjs ${{ inputs.upload && '--upload' || '' }}

            - name: Attach Manifest Artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: tiles-manifest
                  path: tiles.json
